# ============================================================
# 四诊（舌/面/脉/声音）标签体系配置 —— 全系统唯一真相源
# ============================================================
#
# ⚠️ 占位说明：以下子标签为「占位默认值」，请按你的真实四诊
#    标签在此文件编辑后重启后端生效。
#
# 规则（锁定决策 1，实现前必须遵守）：
#   - 4 个 category（舌/面/脉/声音），模型对应 4 个分类头，
#     每头对各自子标签做 softmax 多分类。
#   - 每个 category 的第一个标签固定为「正常/无」默认类。
#   - 子标签名不得重复（同 category 内）。
#
categories:
  - name: 舌
    labels:
      - 正常/无        # ← 固定第一项，勿移动/改名
      - 舌苔薄白
      - 舌苔黄
      - 舌苔黄腻
      - 舌质淡红
      - 舌质红
  - name: 面
    labels:
      - 正常/无        # ← 固定第一项，勿移动/改名
      - 面色红润
      - 面色苍白
      - 面色萎黄
  - name: 脉
    labels:
      - 正常/无        # ← 固定第一项，勿移动/改名
      - 浮
      - 沉
      - 迟
      - 数
  - name: 声音
    labels:
      - 正常/无        # ← 固定第一项，勿移动/改名
      - 清晰
      - 低微
      - 嘶哑
